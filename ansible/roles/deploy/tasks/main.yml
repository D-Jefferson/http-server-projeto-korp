---
- name: Build e deploy da stack via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    build: always
    state: present
  register: compose_result

- name: Aguardar o serviço ficar disponível na porta 80
  wait_for:
    host: localhost
    port: 80
    delay: 5
    timeout: 60
    state: started
