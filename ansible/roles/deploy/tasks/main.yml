---
- name: Ensure docker-compose is available for ansible module
  pip:
    name: docker
    state: present

- name: Build and deploy the application stack
  community.docker.docker_compose:
    project_src: "{{ project_dir }}"
    build: yes
    state: present
  register: compose_result

- name: Wait for services to be ready
  wait_for:
    port: 80
    delay: 5
    timeout: 30
